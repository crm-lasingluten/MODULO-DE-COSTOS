<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Módulo de Costos — Portal de Gestión Bauer Lemans</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<style>
  :root{
    --bg:#F6F5F2; --panel:#FFFFFF; --ink:#1E2321; --ink-soft:#5B635E;
    --line:#E4E1D9; --accent:#2F5D50; --accent-soft:#E7EFEC;
    --warn:#B4552F; --warn-soft:#FBEAE1; --mono:'IBM Plex Mono', 'SF Mono', Consolas, monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--ink);}
  .wrap{max-width:1280px; margin:0 auto; padding:0 20px 80px;}

  /* Nav principal del módulo */
  .module-nav{
    background:var(--panel); border-bottom:1px solid var(--line); margin-bottom:28px;
    position:sticky; top:0; z-index:50;
  }
  .module-nav-inner{max-width:1280px; margin:0 auto; padding:16px 20px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;}
  .module-title{font-size:15px; font-weight:700; letter-spacing:-0.01em;}
  .module-title .dim{color:var(--ink-soft); font-weight:500;}
  .module-tabs{display:flex; gap:4px; background:var(--bg); padding:4px; border-radius:10px;}
  .module-tab{
    padding:8px 16px; border-radius:7px; font-size:13px; font-weight:600; cursor:pointer;
    color:var(--ink-soft); border:none; background:transparent;
  }
  .module-tab.active{background:var(--panel); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.06);}

  header.top{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:22px; flex-wrap:wrap; gap:12px;}
  h1{font-size:22px; margin:0 0 4px; letter-spacing:-0.01em;}
  .sub{color:var(--ink-soft); font-size:13.5px; margin:0;}
  .btn{background:var(--accent); color:#fff; border:none; padding:10px 16px; border-radius:8px; font-size:13.5px; font-weight:600; cursor:pointer;}
  .btn:hover{opacity:.92;}
  .btn.ghost{background:transparent; color:var(--accent); border:1px solid var(--accent);}
  .btn.danger{background:transparent; color:var(--warn); border:1px solid var(--warn-soft);}
  .btn.small{padding:6px 10px; font-size:12.5px; border-radius:6px;}
  .toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px;}
  input[type=text], input[type=number]{border:1px solid var(--line); border-radius:8px; padding:9px 12px; font-size:13.5px; background:#fff;}
  input:focus, select:focus{outline:2px solid var(--accent-soft); border-color:var(--accent);}
  .tabs{display:flex; gap:6px; flex-wrap:wrap;}
  .tab{padding:7px 13px; border-radius:20px; font-size:12.5px; font-weight:600; cursor:pointer; border:1px solid var(--line); background:#fff; color:var(--ink-soft);}
  .tab.active{background:var(--accent); border-color:var(--accent); color:#fff;}
  .panel{background:var(--panel); border:1px solid var(--line); border-radius:12px;}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  thead th{text-align:left; padding:10px 12px; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); border-bottom:1px solid var(--line); background:#FAFAF7; white-space:nowrap;}
  tbody td{padding:9px 12px; border-bottom:1px solid var(--line); vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#FAFAF7;}
  tbody tr.inactive{opacity:.45;}
  .cell-edit{border:1px solid transparent; background:transparent; font:inherit; color:inherit; width:100%; padding:4px 6px; border-radius:5px; font-family:var(--mono);}
  .cell-edit:hover{border-color:var(--line);}
  .cell-edit:focus{outline:none; border-color:var(--accent); background:#fff;}
  .cell-edit.dirty{background:#FFF6E9; border-color:#E3B368;}
  .pill{display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:700; background:var(--accent-soft); color:var(--accent); text-transform:uppercase; letter-spacing:.03em;}
  .muted{color:var(--ink-soft); font-size:12px;}
  .num{font-family:var(--mono); text-align:right;}
  .row-actions{display:flex; gap:6px; justify-content:flex-end;}
  .icon-btn{border:1px solid var(--line); background:#fff; border-radius:6px; width:28px; height:28px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-soft); font-size:14px;}
  .icon-btn:hover{border-color:var(--accent); color:var(--accent);}
  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:8px; font-size:13px; opacity:0; pointer-events:none; transition:opacity .25s; z-index:200;}
  .toast.show{opacity:1;}
  .modal-bg{position:fixed; inset:0; background:rgba(20,22,20,.4); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;}
  .modal{background:#fff; border-radius:14px; padding:26px; width:100%; max-width:520px; max-height:85vh; overflow:auto;}
  .modal h2{margin:0 0 4px; font-size:17px;}
  .modal .muted{margin-bottom:18px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:5px;}
  .field input, .field select{width:100%; border:1px solid var(--line); border-radius:8px; padding:9px 11px; font-size:13.5px; font:inherit;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:20px;}
  .empty{padding:60px 20px; text-align:center; color:var(--ink-soft);}
  .hint{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
  .history-list{list-style:none; margin:0; padding:0; font-size:12.5px;}
  .history-list li{padding:8px 0; border-bottom:1px solid var(--line); display:flex; justify-content:space-between;}
  .history-list li:last-child{border-bottom:none;}
  .col-sep{ border-left:2px solid var(--line); }
  .col-sep-strong{ border-left:2px solid var(--ink); }
  footer.summary{display:flex; gap:18px; padding:12px 4px; font-size:12px; color:var(--ink-soft);}

  /* Layout específico de Recetas */
  .layout{display:grid; grid-template-columns:340px 1fr; gap:18px; align-items:start;}
  @media (max-width:880px){ .layout{grid-template-columns:1fr;} }
  .list-panel{overflow:hidden;}
  .list-toolbar{padding:14px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:10px;}
  .list-toolbar input[type=text]{width:100%;}
  .recipe-item{padding:13px 14px; border-bottom:1px solid var(--line); cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .recipe-item:last-child{border-bottom:none;}
  .recipe-item:hover{background:#FAFAF7;}
  .recipe-item.selected{background:var(--accent-soft);}
  .recipe-item .name{font-size:13.5px; font-weight:600;}
  .recipe-item .meta{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
  .detail{padding:22px;}
  .detail-head{display:flex; justify-content:space-between; align-items:flex-start; gap:14px; margin-bottom:18px; flex-wrap:wrap;}
  .detail-head h2{font-size:19px; margin:0 0 4px;}
  .detail-head .meta-row{display:flex; gap:14px; align-items:center; flex-wrap:wrap; margin-top:6px;}
  .field-inline{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-soft);}
  .field-inline input{width:80px; padding:5px 8px; font-size:13px;}
  .cost-summary{display:grid; gap:12px; margin:18px 0;}
  @media (max-width:640px){ .cost-summary{grid-template-columns:1fr !important;} }
  .cost-card{background:#FAFAF7; border:1px solid var(--line); border-radius:10px; padding:14px 16px;}
  .cost-card .label{font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); margin-bottom:6px;}
  .cost-card .value{font-family:var(--mono); font-size:20px; font-weight:700;}
  .cost-card.highlight{background:var(--accent-soft); border-color:var(--accent);}
  .cost-card.highlight .value{color:var(--accent);}
  .ing-search{position:relative;}
  .ing-search input{width:100%;}
  .ing-dropdown{position:absolute; top:100%; left:0; right:0; background:#fff; border:1px solid var(--line); border-radius:8px; margin-top:4px; max-height:220px; overflow:auto; z-index:20; box-shadow:0 8px 24px rgba(0,0,0,.08);}
  .ing-option{padding:9px 12px; font-size:13px; cursor:pointer; display:flex; justify-content:space-between; gap:10px;}
  .ing-option:hover{background:var(--accent-soft);}
  .ing-option .d{font-weight:600;}
  .ing-option .c{color:var(--ink-soft); font-size:11.5px;}
  .add-ing-row{display:flex; gap:8px; margin-top:14px; align-items:flex-start;}
  .add-ing-row .ing-search{flex:1;}
  .no-ing{padding:30px; text-align:center; color:var(--ink-soft); font-size:13px;}
</style>
</head>
<body>
<div id="root"></div>
<div id="error-banner" style="display:none; position:fixed; top:0; left:0; right:0; background:#B4552F; color:#fff; padding:14px 20px; font:13px -apple-system,sans-serif; z-index:9999; white-space:pre-wrap;"></div>
<script>
  function showErrorBanner(msg) {
    var el = document.getElementById('error-banner');
    el.textContent = 'Error: ' + msg + '  (F12 → Console para más detalle)';
    el.style.display = 'block';
  }
  window.addEventListener('error', function (e) { showErrorBanner(e.message); });
  window.addEventListener('unhandledrejection', function (e) { showErrorBanner(e.reason?.message || String(e.reason)); });
</script>

<script type="text/babel">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const CATEGORIAS = [
  { value: "materia_prima", label: "Materia prima" },
  { value: "packaging", label: "Packaging" },
  { value: "mano_obra", label: "Mano de obra" },

  { value: "logistica", label: "Logística" },
  { value: "otro", label: "Otro" },
];
const UNIDADES = ["g", "unidad", "minuto", "hora", "palet"];

  { value: "lasinglueten", label: "La Sin Gluten" },

];

function fmt(n, dec = 4) {
  if (n === null || n === undefined || n === "") return "—";
  const num = Number(n);
  if (Number.isNaN(num)) return "—";
  const min = Math.min(2, dec);
  return num.toLocaleString("es-ES", { minimumFractionDigits: min, maximumFractionDigits: dec });
}
function timeAgo(iso) {
  if (!iso) return "—";
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 60) return "recién";
  if (diff < 3600) return `hace ${Math.floor(diff/60)} min`;
  if (diff < 86400) return `hace ${Math.floor(diff/3600)} h`;
  return `hace ${Math.floor(diff/86400)} d`;
}
const catLabel = (v) => CATEGORIAS.find(c => c.value === v)?.label || v;
const marcaLabel = (v) => MARCAS.find(m => m.value === v)?.label || v;

function Toast({ message }) {
  return <div className={`toast ${message ? "show" : ""}`}>{message}</div>;
}

/* ============================================================
   VISTA: INSUMOS
   ============================================================ */

function NewInsumoModal({ onClose, onSaved, showToast }) {
  const [form, setForm] = useState({
    categoria: "materia_prima", proveedor: "", cod_art: "", descripcion: "",
    presentacion: "", precio_compra: "", cantidad_presentacion: "",
    unidad_base: "g", costo_unidad_base: "", notas: "",
  });
  const [saving, setSaving] = useState(false);

  useEffect(() => {
    const p = parseFloat(form.precio_compra);
    const c = parseFloat(form.cantidad_presentacion);
    if (!Number.isNaN(p) && !Number.isNaN(c) && c > 0 && form.unidad_base === "g") {
      setForm(f => ({ ...f, costo_unidad_base: (p / (c * 1000)).toFixed(8) }));
    }
  }, [form.precio_compra, form.cantidad_presentacion, form.unidad_base]);

  const set = (k) => (e) => setForm(f => ({ ...f, [k]: e.target.value }));

  const save = async () => {
    if (!form.descripcion.trim()) { showToast("La descripción es obligatoria"); return; }
    setSaving(true);
    const payload = {
      ...form,
      precio_compra: form.precio_compra === "" ? null : Number(form.precio_compra),
      cantidad_presentacion: form.cantidad_presentacion === "" ? null : Number(form.cantidad_presentacion),
      costo_unidad_base: form.costo_unidad_base === "" ? null : Number(form.costo_unidad_base),
    };
    const { error } = await supabase.from("insumos").insert(payload);
    setSaving(false);
    if (error) { showToast("Error al guardar: " + error.message); return; }
    showToast("Materia prima agregada");
    onSaved();
    onClose();
  };

  return (
    <div className="modal-bg" onClick={(e) => e.target === e.currentTarget && onClose()}>
      <div className="modal">
        <h2>Nueva materia prima / insumo</h2>
        <p className="muted">Se agrega a la tabla de proveedores y queda disponible para las recetas.</p>
        <div className="field">
          <label>Categoría</label>
          <select value={form.categoria} onChange={set("categoria")}>
            {CATEGORIAS.map(c => <option key={c.value} value={c.value}>{c.label}</option>)}
          </select>
        </div>
        <div className="field-row">
          <div className="field"><label>Proveedor</label><input type="text" value={form.proveedor} onChange={set("proveedor")} placeholder="llopart" /></div>
          <div className="field"><label>Código artículo</label><input type="text" value={form.cod_art} onChange={set("cod_art")} placeholder="20024" /></div>
        </div>
        <div className="field"><label>Descripción *</label><input type="text" value={form.descripcion} onChange={set("descripcion")} placeholder="harina de arroz" /></div>
        <div className="field-row">
          <div className="field"><label>Presentación</label><input type="text" value={form.presentacion} onChange={set("presentacion")} placeholder="25 kg" /></div>
          <div className="field"><label>Precio de compra (€)</label><input type="number" step="0.0001" value={form.precio_compra} onChange={set("precio_compra")} placeholder="0.725" /></div>
        </div>
        <div className="field-row">
          <div className="field">
            <label>Cantidad de la presentación</label>
            <input type="number" step="0.01" value={form.cantidad_presentacion} onChange={set("cantidad_presentacion")} placeholder="25" />
            <div className="hint">En kg si la unidad base es gramo</div>
          </div>
          <div className="field">
            <label>Unidad base de costeo</label>
            <select value={form.unidad_base} onChange={set("unidad_base")}>
              {UNIDADES.map(u => <option key={u} value={u}>{u}</option>)}
            </select>
          </div>
        </div>
        <div className="field">
          <label>Costo por unidad base (€) {form.unidad_base === "g" ? "— sugerido automáticamente" : "— completar manualmente"}</label>
          <input type="number" step="0.00000001" value={form.costo_unidad_base} onChange={set("costo_unidad_base")} placeholder="0.000725" />
        </div>
        <div className="field"><label>Notas</label><input type="text" value={form.notas} onChange={set("notas")} placeholder="opcional" /></div>
        <div className="modal-actions">
          <button className="btn ghost" onClick={onClose}>Cancelar</button>
          <button className="btn" onClick={save} disabled={saving}>{saving ? "Guardando…" : "Guardar insumo"}</button>
        </div>
      </div>
    </div>
  );
}

function HistoryModal({ insumo, onClose }) {
  const [rows, setRows] = useState(null);
  useEffect(() => {
    supabase.from("insumos_historial_precios").select("*").eq("insumo_id", insumo.id)
      .order("changed_at", { ascending: false }).then(({ data }) => setRows(data || []));
  }, [insumo.id]);

  return (
    <div className="modal-bg" onClick={(e) => e.target === e.currentTarget && onClose()}>
      <div className="modal">
        <h2>Historial de precios</h2>
        <p className="muted">{insumo.descripcion}</p>
        {rows === null && <p className="muted">Cargando…</p>}
        {rows && rows.length === 0 && <p className="muted">Todavía no hay cambios registrados para este insumo.</p>}
        {rows && rows.length > 0 && (
          <ul className="history-list">
            {rows.map(r => (
              <li key={r.id}>
                <span>{fmt(r.precio_compra_anterior)} → <strong>{fmt(r.precio_compra_nuevo)}</strong> € {" · "} {fmt(r.costo_unidad_base_anterior)} → <strong>{fmt(r.costo_unidad_base_nuevo)}</strong> €/u</span>
                <span className="muted">{new Date(r.changed_at).toLocaleString("es-ES")}</span>
              </li>
            ))}
          </ul>
        )}
        <div className="modal-actions"><button className="btn ghost" onClick={onClose}>Cerrar</button></div>
      </div>
    </div>
  );
}

function EditableCell({ value, onCommit, isNumber, width }) {
  const [local, setLocal] = useState(value ?? "");
  const [dirty, setDirty] = useState(false);
  useEffect(() => { setLocal(value ?? ""); setDirty(false); }, [value]);
  const commit = () => {
    if (!dirty) return;
    onCommit(isNumber ? (local === "" ? null : Number(local)) : local);
    setDirty(false);
  };
  return (
    <input
      className={`cell-edit ${dirty ? "dirty" : ""}`}
      style={width ? { width } : undefined}
      type={isNumber ? "number" : "text"}
      step={isNumber ? "0.00000001" : undefined}
      value={local}
      onChange={(e) => { setLocal(e.target.value); setDirty(true); }}
      onBlur={commit}
      onKeyDown={(e) => { if (e.key === "Enter") e.target.blur(); }}
    />
  );
}

function InsumosView({ insumos, reloadInsumos, notify }) {
  const [search, setSearch] = useState("");
  const [tab, setTab] = useState("todos");
  const [showNew, setShowNew] = useState(false);
  const [historyFor, setHistoryFor] = useState(null);
  const [showInactive, setShowInactive] = useState(false);

  const updateField = async (id, field, value) => {
    const { error } = await supabase.from("insumos").update({ [field]: value }).eq("id", id);
    if (error) { notify("No se pudo guardar: " + error.message); reloadInsumos(); return; }
    notify("Precio actualizado");
    reloadInsumos();
  };

  const toggleActivo = async (i) => {
    await supabase.from("insumos").update({ activo: !i.activo }).eq("id", i.id);
    notify(i.activo ? "Insumo desactivado" : "Insumo reactivado");
    reloadInsumos();
  };

  const filtered = useMemo(() => {
    return insumos.filter(i => {
      if (!showInactive && !i.activo) return false;
      if (tab !== "todos" && i.categoria !== tab) return false;
      if (search.trim()) {
        const s = search.toLowerCase();
        const hay = [i.descripcion, i.proveedor, i.cod_art].filter(Boolean).join(" ").toLowerCase();
        if (!hay.includes(s)) return false;
      }
      return true;
    });
  }, [insumos, tab, search, showInactive]);

  return (
    <React.Fragment>
      <header className="top">
        <div>
          <h1>Insumos y proveedores</h1>
          <p className="sub">Mantenimiento de precios de materia prima, packaging, mano de obra y energía</p>
        </div>
        <button className="btn" onClick={() => setShowNew(true)}>+ Nueva materia prima</button>
      </header>

      <div className="toolbar">
        <input type="text" placeholder="Buscar por descripción, proveedor o código…" value={search} onChange={(e) => setSearch(e.target.value)} style={{ minWidth: 260 }} />
        <div className="tabs">
          <div className={`tab ${tab === "todos" ? "active" : ""}`} onClick={() => setTab("todos")}>Todos</div>
          {CATEGORIAS.map(c => <div key={c.value} className={`tab ${tab === c.value ? "active" : ""}`} onClick={() => setTab(c.value)}>{c.label}</div>)}
        </div>
        <label style={{ marginLeft: "auto", fontSize: 12.5, color: "var(--ink-soft)", display: "flex", gap: 6, alignItems: "center", cursor: "pointer" }}>
          <input type="checkbox" checked={showInactive} onChange={(e) => setShowInactive(e.target.checked)} />
          Mostrar inactivos
        </label>
      </div>

      <div className="panel">
        {insumos.length === 0 && <div className="empty">Cargando insumos…</div>}
        {insumos.length > 0 && filtered.length === 0 && <div className="empty">No hay insumos que coincidan con la búsqueda.</div>}
        {filtered.length > 0 && (
          <table>
            <thead>
              <tr>
                <th>Categoría</th><th>Proveedor</th><th>Cód. art.</th><th>Descripción</th><th>Presentación</th>
                <th className="num">Precio compra (€)</th><th>Unidad base</th><th className="num">Costo x unidad base (€)</th>
                <th>Actualizado</th><th></th>
              </tr>
            </thead>
            <tbody>
              {filtered.map(i => (
                <tr key={i.id} className={!i.activo ? "inactive" : ""}>
                  <td><span className="pill">{catLabel(i.categoria)}</span></td>
                  <td><EditableCell value={i.proveedor} onCommit={(v) => updateField(i.id, "proveedor", v)} /></td>
                  <td><EditableCell value={i.cod_art} onCommit={(v) => updateField(i.id, "cod_art", v)} width="80px" /></td>
                  <td><EditableCell value={i.descripcion} onCommit={(v) => updateField(i.id, "descripcion", v)} width="220px" /></td>
                  <td><EditableCell value={i.presentacion} onCommit={(v) => updateField(i.id, "presentacion", v)} width="110px" /></td>
                  <td className="num"><EditableCell value={i.precio_compra} isNumber onCommit={(v) => updateField(i.id, "precio_compra", v)} width="90px" /></td>
                  <td>
                    <select className="cell-edit" value={i.unidad_base} onChange={(e) => updateField(i.id, "unidad_base", e.target.value)}>
                      {UNIDADES.map(u => <option key={u} value={u}>{u}</option>)}
                    </select>
                  </td>
                  <td className="num"><EditableCell value={i.costo_unidad_base} isNumber onCommit={(v) => updateField(i.id, "costo_unidad_base", v)} width="110px" /></td>
                  <td><span className="muted">{timeAgo(i.updated_at)}</span></td>
                  <td>
                    <div className="row-actions">
                      <button className="icon-btn" title="Historial de precios" onClick={() => setHistoryFor(i)}>↺</button>
                      <button className="icon-btn" title={i.activo ? "Desactivar" : "Reactivar"} onClick={() => toggleActivo(i)}>{i.activo ? "✕" : "↻"}</button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>

      <footer className="summary">
        <span>{filtered.length} insumos mostrados</span>
        <span>{insumos.filter(i => i.activo).length} activos en total</span>
      </footer>

      {showNew && <NewInsumoModal onClose={() => setShowNew(false)} onSaved={reloadInsumos} showToast={notify} />}
      {historyFor && <HistoryModal insumo={historyFor} onClose={() => setHistoryFor(null)} />}
    </React.Fragment>
  );
}

function NewRecetaModal({ onClose, onSaved, showToast }) {
  const [form, setForm] = useState({ marca: "lasinglueten", codigo: "", nombre: "", descripcion: "", factor_division: 1 });
  const [saving, setSaving] = useState(false);
  const set = (k) => (e) => setForm(f => ({ ...f, [k]: e.target.value }));

  const save = async () => {
    if (!form.nombre.trim()) { showToast("El nombre es obligatorio"); return; }
    setSaving(true);
    const { data, error } = await supabase.from("receta_produccion").insert({
      ...form, codigo: form.codigo.trim() || null, factor_division: Number(form.factor_division) || 1
    }).select().single();
    setSaving(false);
    if (error?.code === "23505") { showToast("Ese código ya está en uso por otra receta"); return; }
    if (error || !data) { showToast("Error al guardar: " + (error?.message || "sin datos de respuesta")); return; }
    showToast("Receta creada");
    onSaved(data);
    onClose();
  };

  return (
    <div className="modal-bg" onClick={(e) => e.target === e.currentTarget && onClose()}>
      <div className="modal">
        <h2>Nueva receta</h2>
        <p className="muted">Después le agregás los ingredientes desde el editor.</p>
        <div className="field-row">
          <div className="field">
            <label>Marca</label>
            <select value={form.marca} onChange={set("marca")}>
              {MARCAS.map(m => <option key={m.value} value={m.value}>{m.label}</option>)}
            </select>
          </div>
          <div className="field"><label>Código de producto</label><input type="text" value={form.codigo} onChange={set("codigo")} placeholder="ej. BAG-001" /></div>
        </div>
        <div className="field"><label>Nombre *</label><input type="text" value={form.nombre} onChange={set("nombre")} placeholder="Bagel plano - sin gluten" /></div>
        <div className="field"><label>Descripción</label><input type="text" value={form.descripcion} onChange={set("descripcion")} placeholder="opcional" /></div>
        <div className="field"><label>Unidades que rinde la receta (factor de división)</label><input type="number" step="1" value={form.factor_division} onChange={set("factor_division")} placeholder="195" /></div>
        <div className="modal-actions">
          <button className="btn ghost" onClick={onClose}>Cancelar</button>
          <button className="btn" onClick={save} disabled={saving}>{saving ? "Guardando…" : "Crear receta"}</button>
        </div>
      </div>
    </div>
  );
}

function IngredientSearch({ insumos, onPick }) {
  const [q, setQ] = useState("");
  const [open, setOpen] = useState(false);
  const ref = useRef(null);

  useEffect(() => {
    const onClick = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", onClick);
    return () => document.removeEventListener("mousedown", onClick);
  }, []);

  const results = useMemo(() => {
    if (!q.trim()) return insumos.filter(i => i.activo).slice(0, 30);
    const s = q.toLowerCase();
    return insumos.filter(i => i.activo && [i.descripcion, i.proveedor, i.cod_art].filter(Boolean).join(" ").toLowerCase().includes(s)).slice(0, 30);
  }, [q, insumos]);

  return (
    <div className="ing-search" ref={ref}>
      <input type="text" placeholder="Buscar insumo para agregar…" value={q} onFocus={() => setOpen(true)} onChange={(e) => { setQ(e.target.value); setOpen(true); }} />
      {open && results.length > 0 && (
        <div className="ing-dropdown">
          {results.map(i => (
            <div key={i.id} className="ing-option" onClick={() => { onPick(i); setQ(""); setOpen(false); }}>
              <span className="d">{i.descripcion}</span>
              <span className="c">{i.proveedor || "—"} · {fmt(i.costo_unidad_base, 6)} €/{i.unidad_base}</span>
            </div>
          ))}
        </div>
      )}
      {open && results.length === 0 && <div className="ing-dropdown"><div className="ing-option muted">Sin resultados</div></div>}
    </div>
  );
}

function calcularLinea(ri, factor) {
  const costoBase = Number(ri.insumos?.costo_unidad_base) || 0;
  const cantidad = Number(ri.cantidad_g) || 0;
  if (ri.modo_calculo === "envase") {
    // La cantidad es "unidades de producto por envase" (ej. 15 bagels por caja).
    // El costo por unidad de producto es fijo: precio del envase ÷ unidades que entran, no depende del lote.
    const costoXUnidadProducto = cantidad > 0 ? costoBase / cantidad : 0;
    const subtotalLote = costoXUnidadProducto * factor;
    return { subtotalLote, costoXUnidadProducto };
  }
  // Modo "lote": la cantidad es el total consumido en todo el lote (materia prima típica).
  const subtotalLote = cantidad * costoBase;
  const costoXUnidadProducto = factor > 0 ? subtotalLote / factor : 0;
  return { subtotalLote, costoXUnidadProducto };
}

function RecetaDetail({ receta, insumos, onChanged, showToast, onDeleted, onDuplicated }) {
  const [ingredientes, setIngredientes] = useState(null);
  const [factor, setFactor] = useState(receta.factor_division);
  const [porCaja, setPorCaja] = useState(receta.unidades_por_caja ?? "");
  const [porPalet, setPorPalet] = useState(receta.unidades_por_palet ?? "");
  const [marketingPct, setMarketingPct] = useState(receta.marketing_pct ?? "");
  const [codigo, setCodigo] = useState(receta.codigo ?? "");

  const loadIng = useCallback(async () => {
    const { data, error } = await supabase.from("receta_produccion_ingredientes").select("*, insumos(*)").eq("receta_produccion_id", receta.id).order("orden", { ascending: true });
    if (error) { showToast("Error al cargar ingredientes: " + error.message); return; }
    setIngredientes(data);
  }, [receta.id, showToast]);

  useEffect(() => {
    loadIng();
    setFactor(receta.factor_division);
    setPorCaja(receta.unidades_por_caja ?? "");
    setPorPalet(receta.unidades_por_palet ?? "");
    setMarketingPct(receta.marketing_pct ?? "");
    setCodigo(receta.codigo ?? "");
  }, [receta.id, loadIng, receta.factor_division, receta.unidades_por_caja, receta.unidades_por_palet, receta.marketing_pct, receta.codigo]);

  const addIngrediente = async (insumo) => {
    const nextOrden = ingredientes ? ingredientes.length : 0;
    const { error } = await supabase.from("receta_produccion_ingredientes").insert({ receta_produccion_id: receta.id, insumo_id: insumo.id, cantidad_g: 0, orden: nextOrden });
    if (error) { showToast("Error: " + error.message); return; }
    loadIng();
  };

  const updateCantidad = async (id, cantidad) => {
    setIngredientes(prev => prev.map(x => x.id === id ? { ...x, cantidad_g: cantidad } : x));
    const { error } = await supabase.from("receta_produccion_ingredientes").update({ cantidad_g: cantidad }).eq("id", id);
    if (error) { showToast("No se pudo guardar: " + error.message); loadIng(); }
  };

  const updateModo = async (id, modo) => {
    setIngredientes(prev => prev.map(x => x.id === id ? { ...x, modo_calculo: modo } : x));
    const { error } = await supabase.from("receta_produccion_ingredientes").update({ modo_calculo: modo }).eq("id", id);
    if (error) { showToast("No se pudo guardar: " + error.message); loadIng(); }
  };

  const removeIngrediente = async (id) => { await supabase.from("receta_produccion_ingredientes").delete().eq("id", id); loadIng(); };

  const saveFactor = async () => {
    const val = Number(factor) || 1;
    await supabase.from("receta_produccion").update({ factor_division: val }).eq("id", receta.id);
    showToast("Rendimiento actualizado");
    onChanged();
  };

  const savePorCaja = async () => {
    const val = porCaja === "" ? null : Number(porCaja);
    await supabase.from("receta_produccion").update({ unidades_por_caja: val }).eq("id", receta.id);
    showToast("Unidades por caja actualizado");
    onChanged();
  };

  const savePorPalet = async () => {
    const val = porPalet === "" ? null : Number(porPalet);
    await supabase.from("receta_produccion").update({ unidades_por_palet: val }).eq("id", receta.id);
    showToast("Unidades por palet actualizado");
    onChanged();
  };

  const saveMarketingPct = async () => {
    const val = marketingPct === "" ? null : Number(marketingPct);
    await supabase.from("receta_produccion").update({ marketing_pct: val }).eq("id", receta.id);
    showToast("% de marketing actualizado");
    onChanged();
  };

  const saveCodigo = async () => {
    const val = codigo.trim() || null;
    const { error } = await supabase.from("receta_produccion").update({ codigo: val }).eq("id", receta.id);
    if (error?.code === "23505") { showToast("Ese código ya está en uso por otra receta"); setCodigo(receta.codigo ?? ""); return; }
    if (error) { showToast("Error: " + error.message); return; }
    showToast("Código actualizado");
    onChanged();
  };

  const deleteReceta = async () => {
    if (!confirm(`¿Eliminar la receta "${receta.nombre}"? Esto borra también sus ingredientes.`)) return;
    await supabase.from("receta_produccion").delete().eq("id", receta.id);
    showToast("Receta eliminada");
    onDeleted();
  };

  const [duplicating, setDuplicating] = useState(false);

  const duplicateReceta = async () => {
    const nombreSugerido = `${receta.nombre} (copia)`;
    const nuevoNombre = prompt("Nombre para la nueva receta:", nombreSugerido);
    if (!nuevoNombre || !nuevoNombre.trim()) return;

    setDuplicating(true);
    try {
      // 1. Copiar la receta (marca, rendimiento, unidades por caja, % marketing)
      const { data: nueva, error: errReceta } = await supabase.from("receta_produccion").insert({
        marca: receta.marca,
        nombre: nuevoNombre.trim(),
        descripcion: receta.descripcion,
        factor_division: receta.factor_division,
        unidades_por_caja: receta.unidades_por_caja,
        unidades_por_palet: receta.unidades_por_palet,
        marketing_pct: receta.marketing_pct,
      }).select().single();
      if (errReceta || !nueva) throw new Error(errReceta?.message || "no se pudo crear la copia");

      // 2. Copiar todos los ingredientes con su cantidad, orden y modo de cálculo
      if (ingredientes && ingredientes.length > 0) {
        const copias = ingredientes.map(ri => ({
          receta_produccion_id: nueva.id,
          insumo_id: ri.insumo_id,
          cantidad_g: ri.cantidad_g,
          orden: ri.orden,
          modo_calculo: ri.modo_calculo || "lote",
          notas: ri.notas,
        }));
        const { error: errIng } = await supabase.from("receta_produccion_ingredientes").insert(copias);
        if (errIng) throw new Error(errIng.message);
      }

      showToast("Receta duplicada — editá lo que cambie");
      onDuplicated(nueva);
    } catch (e) {
      showToast("Error al duplicar: " + e.message);
    } finally {
      setDuplicating(false);
    }
  };

  const totals = useMemo(() => {
    if (!ingredientes) return { peso: 0, costo: 0 };
    const peso = ingredientes.reduce((s, x) => s + (Number(x.cantidad_g) || 0), 0);
    const costo = ingredientes.reduce((s, x) => s + calcularLinea(x, factor).subtotalLote, 0);
    return { peso, costo };
  }, [ingredientes, factor]);

  const CATEGORY_GROUPS = [
    { key: "materia_prima", label: "Materia prima", match: (c) => c === "materia_prima" },
    { key: "mano_obra_energia", label: "Mano de obra y energía", match: (c) => c === "mano_obra" || c === "energia" },
    { key: "packaging", label: "Packaging", match: (c) => c === "packaging" },
    { key: "otros", label: "Otros (logística, etc.)", match: (c) => c === "logistica" || c === "otro" || !c },
  ];

  const grouped = useMemo(() => {
    if (!ingredientes) return [];
    return CATEGORY_GROUPS
      .map(g => {
        const items = ingredientes.filter(ri => g.match(ri.insumos?.categoria));
        const subtotalLote = items.reduce((s, ri) => s + calcularLinea(ri, factor).subtotalLote, 0);
        return { ...g, items, subtotalLote };
      })
      .filter(g => g.items.length > 0);
  }, [ingredientes, factor]);

  const costoXUnidad = factor > 0 ? totals.costo / factor : 0;
  const uxc = Number(porCaja) || 0;
  const costoXCaja = uxc > 0 ? costoXUnidad * uxc : null;

  // Base sobre la que se aplica marketing: hoy es solo materia prima.
  // Cuando se sumen mano de obra, energía y packaging, se agregan acá y el
  // % de marketing pasa a calcularse sobre el costo total real sin tocar nada más.
  const costoBaseXUnidad = costoXUnidad;
  const pct = Number(marketingPct) || 0;
  const costoFinalXUnidad = costoBaseXUnidad * (1 + pct / 100);
  const costoFinalXCaja = costoXCaja !== null ? costoFinalXUnidad * uxc : null;
  const montoMarketingXUnidad = costoFinalXUnidad - costoBaseXUnidad;

  return (
    <div className="panel detail">
      <div className="detail-head">
        <div>
          <span className="pill">{marcaLabel(receta.marca)}</span>
          <h2 style={{ marginTop: 8 }}>{receta.nombre}</h2>
          {receta.descripcion && <p className="muted" style={{ margin: 0, fontSize: 13 }}>{receta.descripcion}</p>}
          <div className="meta-row">
            <div className="field-inline">
              Código <input type="text" value={codigo} onChange={(e) => setCodigo(e.target.value)} onBlur={saveCodigo} placeholder="ej. BAG-001" style={{ width: 100 }} />
            </div>
            <div className="field-inline">
              Rinde <input type="number" step="1" value={factor} onChange={(e) => setFactor(e.target.value)} onBlur={saveFactor} /> unidades
            </div>
            <div className="field-inline">
              Unidades por caja <input type="number" step="1" value={porCaja} onChange={(e) => setPorCaja(e.target.value)} onBlur={savePorCaja} placeholder="ej. 15" />
            </div>
            <div className="field-inline">
              Unidades por palet <input type="number" step="1" value={porPalet} onChange={(e) => setPorPalet(e.target.value)} onBlur={savePorPalet} placeholder="ej. 160" />
            </div>
            <div className="field-inline">
              % Marketing <input type="number" step="0.1" value={marketingPct} onChange={(e) => setMarketingPct(e.target.value)} onBlur={saveMarketingPct} placeholder="ej. 5" />
            </div>
          </div>
        </div>
        <div style={{ display: "flex", gap: 8, flexShrink: 0 }}>
          <button className="btn ghost small" onClick={duplicateReceta} disabled={duplicating}>
            {duplicating ? "Duplicando…" : "Duplicar receta"}
          </button>
          <button className="btn danger small" onClick={deleteReceta}>Eliminar receta</button>
        </div>
      </div>

      <div className="cost-summary" style={{ gridTemplateColumns: costoXCaja !== null ? "repeat(4,1fr)" : "repeat(3,1fr)" }}>
        <div className="cost-card"><div className="label">Peso total</div><div className="value">{fmt(totals.peso, 1)} g</div></div>
        <div className="cost-card"><div className="label">Costo de producción (total)</div><div className="value">{fmt(totals.costo, 2)} €</div></div>
        <div className="cost-card highlight"><div className="label">Costo de producción x unidad</div><div className="value">{fmt(costoXUnidad, 4)} €</div></div>
        {costoXCaja !== null && (
          <div className="cost-card highlight"><div className="label">Costo de producción x caja</div><div className="value">{fmt(costoXCaja, 4)} €</div></div>
        )}
      </div>

      {pct > 0 && (
        <div className="cost-summary" style={{ gridTemplateColumns: costoFinalXCaja !== null ? "repeat(3,1fr)" : "repeat(2,1fr)", marginTop: 0 }}>
          <div className="cost-card" style={{ background: "#FFF6E9", borderColor: "#E3B368" }}>
            <div className="label">Marketing ({pct}%) x unidad</div>
            <div className="value" style={{ color: "#B4552F" }}>+{fmt(montoMarketingXUnidad, 4)} €</div>
          </div>
          <div className="cost-card highlight"><div className="label">Costo final x unidad</div><div className="value">{fmt(costoFinalXUnidad, 4)} €</div></div>
          {costoFinalXCaja !== null && (
            <div className="cost-card highlight"><div className="label">Costo final x caja</div><div className="value">{fmt(costoFinalXCaja, 4)} €</div></div>
          )}
        </div>
      )}

      {ingredientes === null && <div className="no-ing">Cargando ingredientes…</div>}
      {ingredientes && ingredientes.length === 0 && <div className="no-ing">Todavía no agregaste ingredientes. Buscá uno abajo para empezar.</div>}
      {ingredientes && ingredientes.length > 0 && grouped.map(g => (
        <div key={g.key} style={{ marginTop: 22 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 4 }}>
            <span className="pill" style={{ background: "transparent", border: "1px solid var(--line)", color: "var(--ink-soft)" }}>{g.label}</span>
          </div>
          <table>
            <thead><tr><th>Ingrediente</th><th>Modo</th><th className="num">Cantidad</th><th className="num">Costo x unidad base</th><th className="num">Subtotal (lote)</th><th className="num">Costo x unidad producto</th><th></th></tr></thead>
            <tbody>
              {g.items.map(ri => {
                const { subtotalLote, costoXUnidadProducto } = calcularLinea(ri, factor);
                const esEnvase = ri.modo_calculo === "envase";
                return (
                  <tr key={ri.id}>
                    <td>{ri.insumos?.descripcion || "(insumo eliminado)"}</td>
                    <td>
                      <select className="cell-edit" style={{ fontSize: 11.5 }} value={ri.modo_calculo || "lote"} onChange={(e) => updateModo(ri.id, e.target.value)}>
                        <option value="lote">Consumo del lote</option>
                        <option value="envase">Costo por envase</option>
                      </select>
                    </td>
                    <td className="num">
                      <input type="number" step="0.01" value={ri.cantidad_g} style={{ width: 90, textAlign: "right", fontFamily: "var(--mono)" }}
                        onChange={(e) => setIngredientes(prev => prev.map(x => x.id === ri.id ? { ...x, cantidad_g: e.target.value } : x))}
                        onBlur={(e) => updateCantidad(ri.id, Number(e.target.value) || 0)} />
                      <span className="muted" style={{ marginLeft: 4, fontSize: 11 }}>{esEnvase ? "uds/envase" : ri.insumos?.unidad_base}</span>
                    </td>
                    <td className="num muted">{fmt(ri.insumos?.costo_unidad_base, 6)} € {esEnvase ? "/envase" : ""}</td>
                    <td className="num">{fmt(subtotalLote, 4)} €</td>
                    <td className="num" style={{ fontWeight: 600 }}>{fmt(costoXUnidadProducto, 6)} €</td>
                    <td><button className="icon-btn" title="Quitar" onClick={() => removeIngrediente(ri.id)}>✕</button></td>
                  </tr>
                );
              })}
              <tr>
                <td colSpan="4" style={{ textAlign: "right", fontWeight: 700, fontSize: 12.5 }}>Subtotal {g.label.toLowerCase()}</td>
                <td className="num" style={{ fontWeight: 700 }}>{fmt(g.subtotalLote, 4)} €</td>
                <td className="num" style={{ fontWeight: 700 }}>{fmt(factor > 0 ? g.subtotalLote / factor : 0, 6)} €</td>
                <td></td>
              </tr>
            </tbody>
          </table>
        </div>
      ))}
      {ingredientes && ingredientes.length > 0 && (
        <div style={{ display: "flex", justifyContent: "flex-end", gap: 24, padding: "12px 4px", fontSize: 13, fontWeight: 700, borderTop: "2px solid var(--ink)", marginTop: 4 }}>
          <span>Total producción: {fmt(totals.costo, 4)} €</span>
          <span style={{ color: "var(--accent)" }}>Total x unidad: {fmt(costoXUnidad, 4)} €</span>
        </div>
      )}

      <div className="add-ing-row"><IngredientSearch insumos={insumos} onPick={addIngrediente} /></div>
    </div>
  );
}

function RecetasView({ insumos, notify }) {
  const [recetas, setRecetas] = useState(null);
  const [selectedId, setSelectedId] = useState(null);
  const [marcaTab, setMarcaTab] = useState("todas");
  const [search, setSearch] = useState("");
  const [showNew, setShowNew] = useState(false);

  const loadRecetas = useCallback(async () => {
    const { data, error } = await supabase.from("receta_produccion").select("*").eq("activo", true).order("nombre");
    if (error) { notify("Error: " + error.message); return; }
    setRecetas(data);
  }, [notify]);

  useEffect(() => { loadRecetas(); }, [loadRecetas]);

  const filtered = useMemo(() => {
    if (!recetas) return [];
    return recetas.filter(r => {
      if (marcaTab !== "todas" && r.marca !== marcaTab) return false;
      if (search.trim() && !r.nombre.toLowerCase().includes(search.toLowerCase())) return false;
      return true;
    });
  }, [recetas, marcaTab, search]);

  const selected = recetas?.find(r => r.id === selectedId) || null;

  return (
    <React.Fragment>
      <header className="top">
        <div>
          <h1>Recetas</h1>
          <p className="sub">Editor de ingredientes con costeo de materia prima calculado en vivo</p>
        </div>
        <button className="btn" onClick={() => setShowNew(true)}>+ Nueva receta</button>
      </header>

      <div className="layout">
        <div className="panel list-panel">
          <div className="list-toolbar">
            <input type="text" placeholder="Buscar receta…" value={search} onChange={(e) => setSearch(e.target.value)} />
            <div className="tabs">
              <div className={`tab ${marcaTab === "todas" ? "active" : ""}`} onClick={() => setMarcaTab("todas")}>Todas</div>
              {MARCAS.map(m => <div key={m.value} className={`tab ${marcaTab === m.value ? "active" : ""}`} onClick={() => setMarcaTab(m.value)}>{m.label}</div>)}
            </div>
          </div>
          {recetas === null && <div className="empty">Cargando…</div>}
          {recetas !== null && filtered.length === 0 && <div className="empty">No hay recetas todavía.</div>}
          {filtered.map(r => (
            <div key={r.id} className={`recipe-item ${r.id === selectedId ? "selected" : ""}`} onClick={() => setSelectedId(r.id)}>
              <div>
                <div className="name">{r.nombre}</div>
                <div className="meta">{r.codigo ? `${r.codigo} · ` : ""}{marcaLabel(r.marca)} · rinde {r.factor_division} u.</div>
              </div>
            </div>
          ))}
        </div>

        {selected ? (
          <RecetaDetail
            receta={selected}
            insumos={insumos}
            showToast={notify}
            onChanged={loadRecetas}
            onDeleted={() => { setSelectedId(null); loadRecetas(); }}
            onDuplicated={(nueva) => { loadRecetas(); setSelectedId(nueva.id); }}
          />
        ) : (
          <div className="panel"><div className="empty">Elegí una receta de la lista, o creá una nueva.</div></div>
        )}
      </div>

      {showNew && <NewRecetaModal onClose={() => setShowNew(false)} showToast={notify} onSaved={(r) => { loadRecetas(); setSelectedId(r.id); }} />}
    </React.Fragment>
  );
}

/* ============================================================
   VISTA: RESUMEN DE COSTOS Y PRECIOS
   ============================================================ */

function ResumenCostosView({ notify }) {
  const [productos, setProductos] = useState(null);
  const [lista, setLista] = useState(null);
  const [nombreLista, setNombreLista] = useState("");

  const loadAll = useCallback(async () => {
    // Recetas activas
    const { data: recetas, error: errR } = await supabase.from("receta_produccion").select("*").eq("activo", true).order("nombre");
    if (errR) { notify("Error al cargar recetas: " + errR.message); return; }

    // Todos los ingredientes de todas las recetas, con el insumo asociado, en una sola consulta
    const { data: ingredientes, error: errI } = await supabase.from("receta_produccion_ingredientes").select("*, insumos(*)");
    if (errI) { notify("Error al cargar ingredientes: " + errI.message); return; }

    const porReceta = {};
    (ingredientes || []).forEach(ri => {
      (porReceta[ri.receta_produccion_id] = porReceta[ri.receta_produccion_id] || []).push(ri);
    });

    const productosConCosto = (recetas || []).map(r => {
      const items = porReceta[r.id] || [];
      const costoTotalLote = items.reduce((s, ri) => s + calcularLinea(ri, r.factor_division).subtotalLote, 0);
      const costoXUnidad = r.factor_division > 0 ? costoTotalLote / r.factor_division : 0;
      const costoXUnidadFinal = costoXUnidad * (1 + (Number(r.marketing_pct) || 0) / 100);
      const uxc = Number(r.unidades_por_caja) || 0;
      const uxp = Number(r.unidades_por_palet) || 0;
      const costoXCajaFinal = uxc > 0 ? costoXUnidadFinal * uxc : null;
      const costoXPaletFinal = uxp > 0 ? costoXUnidadFinal * uxp : null;
      return { ...r, costoXUnidadFinal, costoXCajaFinal, costoXPaletFinal, uxc, uxp };
    });

    setProductos(productosConCosto);

    // Lista de precios: traer la primera fila, o crearla si no existe ninguna
    let { data: listas, error: errL } = await supabase.from("lista_precios_costeo").select("*").order("updated_at", { ascending: true }).limit(1);
    if (errL) { notify("Error al cargar lista de precios: " + errL.message); return; }
    if (!listas || listas.length === 0) {
      const { data: nueva, error: errC } = await supabase.from("lista_precios_costeo").insert({ nombre: "Lista de precios" }).select().single();
      if (errC) { notify("Error al crear lista de precios: " + errC.message); return; }
      listas = [nueva];
    }
    setLista(listas[0]);
    setNombreLista(listas[0].nombre);
  }, [notify]);

  useEffect(() => { loadAll(); }, [loadAll]);

  const saveNombreLista = async () => {
    if (!lista || !nombreLista.trim()) return;
    await supabase.from("lista_precios_costeo").update({ nombre: nombreLista.trim() }).eq("id", lista.id);
    notify("Nombre de la lista actualizado");
    setLista(l => ({ ...l, nombre: nombreLista.trim() }));
  };

  const savePct = async (key, value) => {
    if (!lista) return;
    const val = value === "" ? null : Number(value);
    setLista(l => ({ ...l, [key]: val }));
    await supabase.from("lista_precios_costeo").update({ [key]: val }).eq("id", lista.id);
    notify("% actualizado");
  };

  const saveNombrePrecio = async (key, value) => {
    if (!lista) return;
    const val = value.trim() || key;
    setLista(l => ({ ...l, [key]: val }));
    await supabase.from("lista_precios_costeo").update({ [key]: val }).eq("id", lista.id);
    notify("Nombre actualizado");
  };

  const updateCodigo = async (id, codigo) => {
    const val = codigo.trim() || null;
    const { error } = await supabase.from("receta_produccion").update({ codigo: val }).eq("id", id);
    if (error?.code === "23505") { notify("Ese código ya está en uso por otra receta"); loadAll(); return; }
    if (error) { notify("Error: " + error.message); loadAll(); return; }
    setProductos(prev => prev.map(p => p.id === id ? { ...p, codigo: val } : p));
  };

  // Calcula la cadena de 5 precios (unidad y caja) a partir del costo final del producto
  const cadenaPrecios = (producto) => {
    const pcts = [lista?.pct_precio1, lista?.pct_precio2, lista?.pct_precio3, lista?.pct_precio4, lista?.pct_precio5];
    let precioU = producto.costoXUnidadFinal;
    return pcts.map(p => {
      const pct = Number(p) || 0;
      precioU = precioU * (1 + pct / 100);
      const precioC = producto.uxc > 0 ? precioU * producto.uxc : null;
      return { precioU, precioC };
    });
  };

  if (productos === null || lista === null) {
    return <div className="panel"><div className="empty">Cargando resumen de costos…</div></div>;
  }

  return (
    <React.Fragment>
      <header className="top">
        <div>
          <input
            type="text" value={nombreLista} onChange={(e) => setNombreLista(e.target.value)} onBlur={saveNombreLista}
            style={{ fontSize: 22, fontWeight: 700, border: "1px solid transparent", borderRadius: 8, padding: "2px 6px", background: "transparent" }}
            onFocus={(e) => e.target.style.borderColor = "var(--line)"}
          />
          <p className="sub">Costo y precio de venta de todos los productos, con recargos en cascada</p>
        </div>
      </header>

      <div className="panel" style={{ padding: "16px 20px", marginBottom: 16, display: "flex", gap: 24, flexWrap: "wrap" }}>
        {[1, 2, 3, 4, 5].map(n => {
          const nombreKey = `nombre_precio${n}`;
          const nombreAnterior = n === 1 ? "costo" : lista[`nombre_precio${n - 1}`];
          return (
            <div key={n} style={{ display: "flex", flexDirection: "column", gap: 4 }}>
              <input
                type="text" value={lista[nombreKey] ?? ""} placeholder={`Precio ${n}`}
                onChange={(e) => setLista(l => ({ ...l, [nombreKey]: e.target.value }))}
                onBlur={(e) => saveNombrePrecio(nombreKey, e.target.value)}
                style={{ fontWeight: 700, fontSize: 13, border: "1px solid var(--line)", borderRadius: 6, padding: "4px 8px", width: 140 }}
              />
              <div className="field-inline">
                <input
                  type="number" step="0.1" style={{ width: 70 }}
                  value={lista[`pct_precio${n}`] ?? ""}
                  onChange={(e) => setLista(l => ({ ...l, [`pct_precio${n}`]: e.target.value }))}
                  onBlur={(e) => savePct(`pct_precio${n}`, e.target.value)}
                  placeholder="%"
                />
                <span className="muted">% sobre {nombreAnterior}</span>
              </div>
            </div>
          );
        })}
      </div>

      <div className="panel" style={{ overflowX: "auto" }}>
        {productos.length === 0 && <div className="empty">No hay recetas activas todavía.</div>}
        {productos.length > 0 && (
          <table style={{ minWidth: 1600 }}>
            <thead>
              <tr>
                <th rowSpan="3" style={{ verticalAlign: "bottom" }}>cod art</th>
                <th rowSpan="3" style={{ verticalAlign: "bottom" }}>desc</th>
                <th colSpan="5" className="col-sep-strong" style={{ textAlign: "center", background: "var(--accent-soft)", color: "var(--accent)" }}>COSTO</th>
                <th colSpan={5 * 2} className="col-sep-strong" style={{ textAlign: "center", background: "#EAF2EE", color: "var(--accent)" }}>VENTA</th>
              </tr>
              <tr>
                <th colSpan="2" className="col-sep-strong" style={{ textAlign: "center" }}>unidades x</th>
                <th colSpan="3" className="col-sep" style={{ textAlign: "center" }}>costo x</th>
                {[1, 2, 3, 4, 5].map(n => (
                  <th key={n} colSpan="2" className="col-sep-strong" style={{ textAlign: "center" }}>{lista[`nombre_precio${n}`] || `Precio ${n}`}</th>
                ))}
              </tr>
              <tr>
                <th className="num col-sep-strong">caja</th>
                <th className="num">palet</th>
                <th className="num col-sep">unidad</th>
                <th className="num">caja</th>
                <th className="num">palet</th>
                {[1, 2, 3, 4, 5].map(n => (
                  <React.Fragment key={n}>
                    <th className="num col-sep-strong">caja</th>
                    <th className="num">unidad</th>
                  </React.Fragment>
                ))}
              </tr>
            </thead>
            <tbody>
              {productos.map(p => {
                const precios = cadenaPrecios(p);
                return (
                  <tr key={p.id}>
                    <td>
                      <EditableCell value={p.codigo} onCommit={(v) => updateCodigo(p.id, v || "")} width="90px" />
                    </td>
                    <td>{p.nombre} <span className="muted">· {marcaLabel(p.marca)}</span></td>
                    <td className="num muted col-sep-strong">{p.uxc > 0 ? p.uxc : "—"}</td>
                    <td className="num muted">{p.uxp > 0 ? p.uxp : "—"}</td>
                    <td className="num col-sep">{fmt(p.costoXUnidadFinal, 2)}</td>
                    <td className="num">{p.costoXCajaFinal !== null ? fmt(p.costoXCajaFinal, 2) : "—"}</td>
                    <td className="num">{p.costoXPaletFinal !== null ? fmt(p.costoXPaletFinal, 2) : "—"}</td>
                    {precios.map((pr, i) => (
                      <React.Fragment key={i}>
                        <td className="num col-sep-strong" style={{ fontWeight: 600 }}>{pr.precioC !== null ? `${fmt(pr.precioC, 2)} €` : "—"}</td>
                        <td className="num">{fmt(pr.precioU, 2)} €</td>
                      </React.Fragment>
                    ))}
                  </tr>
                );
              })}
            </tbody>
          </table>
        )}
      </div>
    </React.Fragment>
  );
}

/* ============================================================
   APP RAÍZ — navegación entre módulos
   ============================================================ */

function App() {
  const [view, setView] = useState("insumos"); // "insumos" | "recetas"
  const [insumos, setInsumos] = useState([]);
  const [toast, setToast] = useState("");

  const notify = (msg) => { setToast(msg); setTimeout(() => setToast(""), 2600); };

  const loadInsumos = useCallback(async () => {
    const { data, error } = await supabase.from("insumos").select("*").order("categoria").order("descripcion");
    if (error) { notify("Error al cargar insumos: " + error.message); return; }
    setInsumos(data || []);
  }, []);

  useEffect(() => { loadInsumos(); }, [loadInsumos]);

  // Refrescar insumos cada vez que se entra a Recetas, para que el buscador de ingredientes
  // siempre tenga los precios y altas más recientes sin depender de un F5 manual.
  const goTo = (v) => { setView(v); if (v === "recetas") loadInsumos(); };

  return (
    <React.Fragment>
      <nav className="module-nav">
        <div className="module-nav-inner">
          <div className="module-title">Módulo de Costos <span className="dim">· Bauer Lemans</span></div>
          <div className="module-tabs">
            <button className={`module-tab ${view === "insumos" ? "active" : ""}`} onClick={() => goTo("insumos")}>Insumos y proveedores</button>
            <button className={`module-tab ${view === "recetas" ? "active" : ""}`} onClick={() => goTo("recetas")}>Recetas</button>
            <button className={`module-tab ${view === "resumen" ? "active" : ""}`} onClick={() => goTo("resumen")}>Resumen de costos</button>
          </div>
        </div>
      </nav>

      <div className="wrap">
        {view === "insumos" && <InsumosView insumos={insumos} reloadInsumos={loadInsumos} notify={notify} />}
        {view === "recetas" && <RecetasView insumos={insumos} notify={notify} />}
        {view === "resumen" && <ResumenCostosView notify={notify} />}
      </div>

      <Toast message={toast} />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
